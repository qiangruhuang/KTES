<rect x="655" y="50" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="685" y="100" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="start" fill="#111111">3</text>
<text x="780" y="155" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">Endpoint</text>
<text x="780" y="197" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">semantics</text>
<line x1="905" y1="140" x2="960" y2="140" stroke="#111111" stroke-width="4"/>
<polygon points="960,140 944,130 944,150" fill="#111111"/>
<rect x="960" y="50" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="990" y="100" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="start" fill="#111111">4</text>
<text x="1085" y="155" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">Realized-design</text>
<text x="1085" y="197" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">provenance</text>
<line x1="1210" y1="140" x2="1265" y2="140" stroke="#111111" stroke-width="4"/>
<polygon points="1265,140 1249,130 1249,150" fill="#111111"/>
<rect x="1265" y="50" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
