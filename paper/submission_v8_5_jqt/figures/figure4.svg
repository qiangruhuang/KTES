<text x="1390" y="197" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">performance + UQ</text>
<line x1="1515" y1="140" x2="1570" y2="140" stroke="#111111" stroke-width="4"/>
<polygon points="1570,140 1554,130 1554,150" fill="#111111"/>
<rect x="1570" y="50" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
