<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="760" viewBox="0 0 1900 760" role="img" aria-labelledby="title desc">
<title id="title">Validity gates</title>
<desc id="desc">Engineering evidence is assigned only after source, design, endpoint, provenance, and numerical gates.</desc>
<rect x="0" y="0" width="1900" height="760" fill="#FFFFFF"/>
<rect x="45" y="50" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
