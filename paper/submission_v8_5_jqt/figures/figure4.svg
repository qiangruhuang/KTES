<circle cx="170" cy="320" r="11" fill="#111111"/>
<text x="198" y="330" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" text-anchor="start" fill="#555555">STOP: source structure</text>
<text x="55" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">AMOVFLY</text>
<line x1="320" y1="408" x2="780" y2="408" stroke="#111111" stroke-width="5"/>
<circle cx="780" cy="408" r="11" fill="#111111"/>
<text x="808" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" text-anchor="start" fill="#555555">endpoint-semantic limitation</text>
<text x="55" y="506" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Hosted replay</text>
<line x1="320" y1="496" x2="1085" y2="496" stroke="#111111" stroke-width="5"/>
<circle cx="1085" cy="496" r="11" fill="#111111"/>
<text x="1113" y="506" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" text-anchor="start" fill="#555555">immutable realized design required</text>
<text x="55" y="594" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Anti-UAV410</text>
<line x1="320" y1="584" x2="1695" y2="584" stroke="#111111" stroke-width="5"/>
<circle cx="1695" cy="584" r="11" fill="#111111"/>
<text x="1670" y="636" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" text-anchor="end" fill="#555555">PASS with execution clarification</text>
<text x="950" y="735" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#111111">Numerical success is necessary but not sufficient for an unrestricted engineering claim.</text>
