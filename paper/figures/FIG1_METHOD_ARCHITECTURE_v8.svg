<text x="1610.0" y="474" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">Accept / Reject /</text>
<text x="1610.0" y="506" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">Inconclusive</text>
