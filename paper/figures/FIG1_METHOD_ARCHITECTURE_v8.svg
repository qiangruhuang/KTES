<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
<title id="title">c-pKTES-Hedge method architecture</title>
<desc id="desc">KTES v8 submission figure generated from frozen manuscript values.</desc>
<rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>
<text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Fig. 1. Probability-preserving active test allocation</text>
<rect x="70" y="170" width="260" height="170" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">Finite operational population</text>
<text x="200.0" y="254" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">Outcome-blind covariates</text>
<text x="200.0" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">+ operational weights</text>
<rect x="400" y="120" width="270" height="150" rx="8" fill="#F3F3F3" stroke="#111111" stroke-width="2"/>
<text x="535.0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">3 certainty sentinels</text>
<text x="535.0" y="204" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">Outcome-blind</text>
<text x="535.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">π = 1</text>
<rect x="400" y="330" width="270" height="190" rx="8" fill="#F3F3F3" stroke="#111111" stroke-width="2"/>
<text x="535.0" y="375" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">37-unit remainder</text>
<text x="535.0" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">positive π</text>
<text x="535.0" y="446" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">80% kernel novelty</text>
<text x="535.0" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">20% adverse-tail</text>
<rect x="760" y="220" width="280" height="190" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="900.0" y="265" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">Local Cube</text>
<text x="900.0" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">fixed stratum allocation</text>
<text x="900.0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">spreading + balance</text>
<rect x="1130" y="220" width="280" height="190" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="1270.0" y="265" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">Hájek MA estimator</text>
<text x="1270.0" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">stratum-wise residual</text>
<text x="1270.0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">correction</text>
<rect x="1490" y="160" width="240" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="1610.0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#111111">Frozen UQ</text>
<text x="1610.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">max(GS, PWR)</text>
<text x="1610.0" y="276" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#666666">R3 calibration</text>
