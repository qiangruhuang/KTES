<text x="1310.0" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">Split15/domain estimator</text>
<text x="1310.0" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">needed execution clarification</text>
