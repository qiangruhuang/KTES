<text x="680.0" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">PASS</text>
<rect x="820" y="230" width="330" height="210" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="985.0" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">Profile Δ vs SRS +0.00404</text>
<text x="985.0" y="319" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">95% CI [0.00137, 0.00671]</text>
<text x="985.0" y="353" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">inside +0.01 NI bound;</text>
