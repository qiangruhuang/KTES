<text x="1310.0" y="530" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">Flight-level preoutcome</text>
<text x="1310.0" y="564" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#666666">frame not recoverable</text>
<rect x="1480" y="475" width="340" height="210" rx="2" fill="#F3F3F3" stroke="#111111" stroke-width="2"/>
