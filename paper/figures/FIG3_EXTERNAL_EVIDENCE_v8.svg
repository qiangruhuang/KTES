<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050" role="img" aria-labelledby="title desc">
<title id="title">Layered external validation</title>
<desc id="desc">KTES v8 submission figure generated from frozen manuscript values.</desc>
<rect x="0" y="0" width="1900" height="1050" fill="#FFFFFF"/>
<text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Fig. 3. External validation is layered: numerical performance is only one gate</text>
<rect x="70" y="120" width="210" height="80" rx="2" fill="#F3F3F3" stroke="#111111" stroke-width="2"/>
