<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">R5 independent controlled confirmation</title>
<desc id="desc">KTES v8 submission figure generated from frozen manuscript values.</desc>
<rect x="0" y="0" width="1800" height="1100" fill="#FFFFFF"/>
<text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Fig. 2. R5 independent confirmation: preserve discovery, improve inference</text>
