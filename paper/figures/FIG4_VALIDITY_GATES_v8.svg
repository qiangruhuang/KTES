<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1000" viewBox="0 0 1900 1000" role="img" aria-labelledby="title desc">
<title id="title">Validity gates and provenance</title>
<desc id="desc">KTES v8 submission figure generated from frozen manuscript values.</desc>
<rect x="0" y="0" width="1900" height="1000" fill="#FFFFFF"/>
<text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111111">Fig. 4. Engineering evidence is a gated chain, not a single accuracy number</text>
<rect x="80" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="110" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">1</text>
<text x="195" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Preoutcome</text>
<text x="195" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">source structure</text>
<line x1="310" y1="285" x2="380" y2="285" stroke="#111111" stroke-width="2"/>
<polygon points="380,285 370,279 370,291" fill="#111111"/>
<rect x="380" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="410" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">2</text>
<text x="495" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Frozen design</text>
<text x="495" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">identity</text>
<line x1="610" y1="285" x2="680" y2="285" stroke="#111111" stroke-width="2"/>
<polygon points="680,285 670,279 670,291" fill="#111111"/>
<rect x="680" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="710" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">3</text>
<text x="795" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Endpoint</text>
<text x="795" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">semantics</text>
<line x1="910" y1="285" x2="980" y2="285" stroke="#111111" stroke-width="2"/>
<polygon points="980,285 970,279 970,291" fill="#111111"/>
<rect x="980" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="1010" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">4</text>
<text x="1095" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Realized-design</text>
<text x="1095" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">provenance</text>
<line x1="1210" y1="285" x2="1280" y2="285" stroke="#111111" stroke-width="2"/>
<polygon points="1280,285 1270,279 1270,291" fill="#111111"/>
<rect x="1280" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="1310" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">5</text>
<text x="1395" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Numerical</text>
<text x="1395" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">performance + UQ</text>
<line x1="1510" y1="285" x2="1580" y2="285" stroke="#111111" stroke-width="2"/>
<polygon points="1580,285 1570,279 1570,291" fill="#111111"/>
<rect x="1580" y="210" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<text x="1610" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">6</text>
<text x="1695" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">Claim</text>
<text x="1695" y="322" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">classification</text>
<text x="90" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#111111">IDF-DS</text>
<line x1="300" y1="493" x2="195" y2="493" stroke="#111111" stroke-width="4"/>
<circle cx="195" cy="493" r="10" fill="#111111"/>
<text x="225" y="500" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#666666">STOP: public release cannot instantiate the frozen flight-level preoutcome frame</text>
<text x="90" y="610" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#111111">Anti-UAV410</text>
<line x1="300" y1="603" x2="1695" y2="603" stroke="#111111" stroke-width="4"/>
<circle cx="1695" cy="603" r="10" fill="#111111"/>
<text x="1725" y="610" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#666666">PASS WITH EXECUTION CLARIFICATION</text>
<text x="90" y="720" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#111111">AMOVFLY</text>
<line x1="300" y1="713" x2="795" y2="713" stroke="#111111" stroke-width="4"/>
<circle cx="795" cy="713" r="10" fill="#111111"/>
<text x="825" y="720" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#666666">Numerical gate passes later, but endpoint semantics limit the engineering claim</text>
<text x="90" y="830" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#111111">Hosted-runner replay</text>
<line x1="300" y1="823" x2="1095" y2="823" stroke="#111111" stroke-width="4"/>
<circle cx="1095" cy="823" r="10" fill="#111111"/>
<text x="1125" y="830" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#666666">254/257 first-order inclusion probabilities drift &gt; 1e−12; immutable design object required</text>
<text x="950" y="955" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#111111">A favorable numerical comparison is necessary but not sufficient for an unrestricted engineering-validity claim.</text>
</svg>