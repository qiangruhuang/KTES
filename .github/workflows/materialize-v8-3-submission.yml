name: Materialize v8.3 submission text assets

on:
  push:
    paths:
      - 'paper/PAPER_IEEE_v8_3.payload/**'
      - 'scripts/materialize_v8_3_submission.py'
      - '.github/workflows/materialize-v8-3-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify canonical text assets
        run: python scripts/materialize_v8_3_submission.py
      - name: Commit canonical text assets if needed
        run: |
          TARGETS='paper/PAPER_IEEE_v8_3.md paper/SUPPLEMENTARY_INFORMATION_v8_3.md paper/references_v8_3.bib paper/IEEE_JOURNAL_FORMAT_GATE_v8_3.md paper/IEEE_LATEX_MAPPING_v8_3.md paper/VIRTUAL_PAGEFLOW_AUDIT_v8_3.md paper/REFERENCE_FORMAT_AUDIT_v8_3.md paper/ADVERSARIAL_REVIEW_v8_3.md paper/AUTOMATED_FREEZE_AUDIT_v8_3.md paper/HANDOFF_v8_3.md paper/V8_3_SUBMISSION_MANIFEST.json scripts/audit_v8_3_submission.py'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'v8.3 text assets already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'paper: materialize canonical v8.3 submission text assets'
          git push
