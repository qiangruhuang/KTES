name: Phase2B source reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/phase2b_source_reconciliation.py'
      - '.github/workflows/phase2b_source_reconciliation.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check remotezip==0.12.3 requests==2.32.5
      - name: Reconcile structure without outcomes
        run: python scripts/phase2b_source_reconciliation.py --out outputs/phase2b_source_reconciliation
      - name: Hash evidence
        run: |
          cd outputs/phase2b_source_reconciliation
          sha256sum PHASE2B_SOURCE_RECONCILIATION_v8.md phase2b_source_reconciliation_v8.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase2b-v8-source-reconciliation
          path: outputs/phase2b_source_reconciliation/
          retention-days: 90
