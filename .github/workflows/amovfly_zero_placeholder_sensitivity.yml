name: AMOVFLY zero-placeholder post-outcome sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_amovfly_zero_placeholder_sensitivity.py'
      - '.github/workflows/amovfly_zero_placeholder_sensitivity.yml'

permissions:
  contents: read
  actions: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout KTES
        uses: actions/checkout@v4

      - name: Checkout pinned AMOVFLY source
        uses: actions/checkout@v4
        with:
          repository: YujiaoHu/AMOVFLY-Dataset
          ref: 67069ed00ddbebd62b71aa9bb1272415e9b15ff8
          path: external/AMOVFLY-Dataset
          fetch-depth: 1

      - name: Download immutable successful confirmatory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/frozen_confirmatory
          gh run download 37564463826 \
            --repo qiangruhuang/KTES \
            --name amovfly-v8-frozen-external-validation \
            --dir inputs/frozen_confirmatory
          echo "a5b241f9d17be696652f30968bb1b8a0d2138087674ac371866b606e8362696b  inputs/frozen_confirmatory/AMOVFLY_DESIGN_OBJECT_REBUILT_v8.json" | sha256sum -c -

      - name: Set up frozen numerical runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 requests==2.32.5

      - name: Rebuild and verify frozen path frame
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/amovfly_preoutcome_path_inventory.py --out outputs/amovfly_preoutcome
          echo "92a6d63eb75a0eee58e9d310da9b140517e2dffd2c6f48986fd21b40c8b12c85  outputs/amovfly_preoutcome/amovfly_path_only_unit_frame_v8.csv" | sha256sum -c -

      - name: Run exact-zero post-outcome sensitivity from frozen design
        run: |
          mkdir -p outputs/amovfly_zero_sensitivity
          python scripts/run_amovfly_zero_placeholder_sensitivity.py \
            --frame outputs/amovfly_preoutcome/amovfly_path_only_unit_frame_v8.csv \
            --frozen-design inputs/frozen_confirmatory/AMOVFLY_DESIGN_OBJECT_REBUILT_v8.json \
            --source-root external/AMOVFLY-Dataset \
            --vendor-src vendor/r5_engine_recovered_v8/src \
            --out outputs/amovfly_zero_sensitivity

      - name: Freeze sensitivity hashes
        if: always()
        run: |
          if [ -d outputs/amovfly_zero_sensitivity ]; then
            (cd outputs/amovfly_zero_sensitivity && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
            test ! -f outputs/amovfly_zero_sensitivity/AMOVFLY_ZERO_PLACEHOLDER_SENSITIVITY_v8.md || cat outputs/amovfly_zero_sensitivity/AMOVFLY_ZERO_PLACEHOLDER_SENSITIVITY_v8.md
            test ! -f outputs/amovfly_zero_sensitivity/AMOVFLY_ZERO_PLACEHOLDER_SENSITIVITY_v8.json || cat outputs/amovfly_zero_sensitivity/AMOVFLY_ZERO_PLACEHOLDER_SENSITIVITY_v8.json
          fi

      - name: Upload immutable sensitivity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amovfly-v8-zero-placeholder-sensitivity
          path: outputs/amovfly_zero_sensitivity/
          if-no-files-found: error
          retention-days: 90
