name: AMOVFLY post-outcome waypoint semantic audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_amovfly_waypoint_semantics.py'
      - '.github/workflows/amovfly_postoutcome_semantic_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout KTES
        uses: actions/checkout@v4

      - name: Checkout pinned AMOVFLY source
        uses: actions/checkout@v4
        with:
          repository: YujiaoHu/AMOVFLY-Dataset
          ref: 67069ed00ddbebd62b71aa9bb1272415e9b15ff8
          path: external/AMOVFLY-Dataset
          fetch-depth: 1

      - name: Set up frozen numerical runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 requests==2.32.5

      - name: Rebuild and verify frozen path frame
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/amovfly_preoutcome_path_inventory.py --out outputs/amovfly_preoutcome
          echo "92a6d63eb75a0eee58e9d310da9b140517e2dffd2c6f48986fd21b40c8b12c85  outputs/amovfly_preoutcome/amovfly_path_only_unit_frame_v8.csv" | sha256sum -c -

      - name: Run post-outcome semantic audit
        run: |
          mkdir -p outputs/amovfly_semantic_audit
          python scripts/audit_amovfly_waypoint_semantics.py \
            --frame outputs/amovfly_preoutcome/amovfly_path_only_unit_frame_v8.csv \
            --source-root external/AMOVFLY-Dataset \
            --out outputs/amovfly_semantic_audit

      - name: Freeze audit hashes
        if: always()
        run: |
          if [ -d outputs/amovfly_semantic_audit ]; then
            (cd outputs/amovfly_semantic_audit && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
            cat outputs/amovfly_semantic_audit/AMOVFLY_WAYPOINT_SEMANTIC_AUDIT_v8.md
            cat outputs/amovfly_semantic_audit/AMOVFLY_WAYPOINT_SEMANTIC_AUDIT_v8.json
          fi

      - name: Upload immutable audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amovfly-v8-postoutcome-waypoint-semantic-audit
          path: outputs/amovfly_semantic_audit/
          if-no-files-found: error
          retention-days: 90
